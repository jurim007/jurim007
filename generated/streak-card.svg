<svg
  width="300"
  height="110"
  viewBox="0 0 300 110"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="GitHub current streak: 13"
>
  <!-- Card -->
  <rect
    x="0.5"
    y="0.5"
    width="299"
    height="109"
    rx="10"
    fill="#0D1117"
    stroke="#30363D"
  />

  <!-- Left: streak ring -->
  <circle
    cx="66"
    cy="57"
    r="34"
    stroke="#E0A458"
    stroke-width="4"
    fill="none"
  />

  <!-- Flame -->
  <g transform="translate(58 10)">
    <path
      d="
        M8 0
        C10 7 16 8 16 15
        C16 21 12.4 25 8 25
        C3.6 25 0 21.4 0 16.5
        C0 12.2 2.4 9.4 5.1 6.7
        C5 10.8 7.1 12.4 9 12.4
        C11.2 12.4 12.5 10.6 12.5 8.7
        C12.5 5.6 10.1 3.8 8 0
        Z
      "
      fill="#0D1117"
      stroke="#E0A458"
      stroke-width="2.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- Streak number -->
  <text
    x="66"
    y="64"
    text-anchor="middle"
    fill="#C9D1D9"
    font-size="23"
    font-weight="600"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
  >13</text>

  <!-- Right: label -->
  <text
    x="125"
    y="49"
    fill="#E0A458"
    font-size="14"
    font-weight="600"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
  >Current Streak</text>

  <!-- Right: dates -->
  <text
    x="125"
    y="70"
    fill="#C9D1D9"
    font-size="11"
    font-weight="400"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
  >Sep 10 - Sep 22</text>
</svg>
