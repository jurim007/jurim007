<svg
  width="300"
  height="110"
  viewBox="0 0 300 110"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="GitHub current streak: 13"
>

  <title>GitHub Current Streak: 13</title>

  <!-- ======================================================
       CARD BACKGROUND
       ====================================================== -->

  <rect
    x="0.5"
    y="0.5"
    width="299"
    height="109"
    rx="10"
    fill="#0D1117"
    stroke="#30363D"
  />


  <!-- ======================================================
       LEFT STREAK INDICATOR

       This is intentionally a PATH rather than a circle.

       The missing section at the top creates a real gap
       for the flame instead of drawing a circle behind it.
       ====================================================== -->

  <path
    d="
      M 52 25

      A 34 34
      0
      1
      0
      80 25
    "
    fill="none"
    stroke="#E0A458"
    stroke-width="4"
    stroke-linecap="round"
  />


  <!-- ======================================================
       FLAME

       Separate outlined flame sitting inside the gap.
       Nothing is being masked or painted over the ring,
       which keeps the intersection clean.
       ====================================================== -->

  <g
    transform="translate(56.5 7)"
    fill="none"
    stroke="#E0A458"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <path
      d="
        M 9.5 1

        C 9.8 4.5,
          8.8 6.6,
          7.2 8.6

        C 5.7 10.4,
          4.5 12,
          4.5 14.5

        C 4.5 18.7,
          7.4 21.5,
          11 21.5

        C 14.8 21.5,
          17.5 18.6,
          17.5 14.6

        C 17.5 11.2,
          15.6 8.6,
          13.3 6.2

        C 13.5 9.2,
          12.2 11,
          10.4 11

        C 8.5 11,
          7.4 9.5,
          7.7 7.7

        C 8 5.6,
          9.2 3.4,
          9.5 1

        Z
      "
    />

  </g>


  <!-- ======================================================
       STREAK NUMBER
       ====================================================== -->

  <text
    x="66"
    y="65"
    text-anchor="middle"
    fill="#C9D1D9"
    font-size="23"
    font-weight="600"
    font-family="
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      'Liberation Mono',
      'Courier New',
      monospace
    "
  >13</text>


  <!-- ======================================================
       RIGHT SIDE
       ====================================================== -->

  <!-- Current Streak -->

  <text
    x="124"
    y="50"
    fill="#E0A458"
    font-size="14"
    font-weight="600"
    font-family="
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      'Liberation Mono',
      'Courier New',
      monospace
    "
  >Current Streak</text>


  <!-- Date range -->

  <text
    x="124"
    y="71"
    fill="#C9D1D9"
    font-size="11"
    font-weight="400"
    font-family="
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      'Liberation Mono',
      'Courier New',
      monospace
    "
  >Sep 10 - Sep 22</text>

</svg>