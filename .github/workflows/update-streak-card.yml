name: Update Streak Card
on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak circle
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=jurim007&hide_total_contributions=true&hide_longest_streak=true&background=0D1117&border=30363D&border_radius=10&ring=E0A458&fire=E0A458&currStreakNum=C9D1D9&currStreakLabel=E0A458&dates=C9D1D9&card_width=300&card_height=170
          path: generated/streak-card.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Pull latest changes
        run: git pull --rebase --autostash origin main

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update streak card"
          file_pattern: generated/streak-card.svg