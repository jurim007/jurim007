name: Update Streak Card

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"

  # Lets you run it manually from the Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node is used by our custom streak generator
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Generate generated/streak-card.svg
      - name: Generate streak card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: jurim007
        run: node scripts/generate-streak.js

      # Make sure we're based on the latest version of main
      # before committing the generated SVG
      - name: Pull latest changes
        run: git pull --rebase --autostash origin main

      # Commit only if the generated card actually changed
      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update streak card"
          file_pattern: generated/streak-card.svg