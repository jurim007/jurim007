name: Update Contributions Counter
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, fully automatic
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution count and build SVG
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const fs = require('fs');
            const username = "jurim007";

            const query = `
              query {
                user(login: "${username}") {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              headers: { authorization: `token ${process.env.METRICS_TOKEN}` }
            });

            const count = result.user.contributionsCollection.contributionCalendar.totalContributions;
            const digits = String(count).split("");

            // PNG stores width/height as big-endian uint32s starting at byte 16
            // (8-byte signature + 4-byte chunk length + 4-byte "IHDR" type).
            function getPngSize(buffer) {
              const width = buffer.readUInt32BE(16);
              const height = buffer.readUInt32BE(20);
              return { width, height };
            }

            const targetHeight = 150; // every character scales to this height, own width preserved
            const gap = 3;

            let cursorX = 0;
            const imageTags = [];

            for (const d of digits) {
              const dir = `assets/counter/${d}`;
              const variants = fs.readdirSync(dir).filter(f => f.endsWith('.png'));
              const chosen = variants[Math.floor(Math.random() * variants.length)];
              const bytes = fs.readFileSync(`${dir}/${chosen}`);
              const { width, height } = getPngSize(bytes);
              const scaledWidth = width * (targetHeight / height);

              const base64 = bytes.toString('base64');
              imageTags.push(
                `<image href="data:image/png;base64,${base64}" x="${cursorX}" y="0" width="${scaledWidth}" height="${targetHeight}" />`
              );

              cursorX += scaledWidth + gap;
            }

            const totalWidth = cursorX - gap; // no trailing gap after the last character
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalWidth}" height="${targetHeight}">${imageTags.join("")}</svg>`;

            fs.mkdirSync('generated', { recursive: true });
            fs.writeFileSync('generated/contributions.svg', svg);
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contributions counter"
          file_pattern: generated/contributions.svg